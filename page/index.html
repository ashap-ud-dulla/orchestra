<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Orchestra</title>
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <a class="brand" href="#/">Orchestra</a>
  <nav>
    <a href="#/" data-nav="board">Board</a>
    <a href="#/templates" data-nav="templates">Templates</a>
  </nav>
  <span class="grow"></span>
  <span id="conn" class="conn" title="Live connection to the server"></span>
  <button class="primary" id="new-run">New run</button>
</header>
<main id="view"></main>

<dialog id="start-dialog">
  <form method="dialog" id="start-form">
    <h2>New run</h2>
    <label>Template <select name="templateId" required></select></label>
    <label>Input <textarea name="text" rows="4" placeholder="Jira key, or a few lines about the job"></textarea></label>
    <div id="start-repos"></div>
    <div class="row end">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="draft" title="Make the run, change its boxes, then press Start">Edit boxes first</button>
      <button value="start" class="primary">Start</button>
    </div>
  </form>
</dialog>

<script src="app.js"></script>
</body>
</html>
